name: Build Arya OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "build/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools

      - name: Configure Arya OS from project settings
        run: sudo sh auto/config

      - name: Prepare executable build hooks
        run: sudo chmod +x config/hooks/normal/*.hook.chroot

      - name: Prepare host-side ISOLINUX boot files
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y isolinux syslinux-common
          ISOLINUX_BIN="$(dpkg -L isolinux | grep -m1 '/isolinux\.bin$')"
          VESAMENU="$(dpkg -L syslinux-common | grep -m1 '/vesamenu\.c32$')"
          test -s "$ISOLINUX_BIN"
          test -s "$VESAMENU"
          sudo install -d /root/isolinux
          sudo install -m 0644 "$ISOLINUX_BIN" /root/isolinux/isolinux.bin
          sudo install -m 0644 "$VESAMENU" /root/isolinux/vesamenu.c32
          while IFS= read -r module; do
            sudo install -m 0644 "$module" "/root/isolinux/$(basename "$module")"
          done < <(dpkg -L syslinux-common | grep '/usr/lib/syslinux/modules/bios/.*\.c32$' || true)
          ls -lh /root/isolinux/
          test -s /root/isolinux/isolinux.bin
          test -s /root/isolinux/vesamenu.c32

      - name: Build hybrid ISO
        run: sudo lb build

      - name: Find generated ISO
        id: iso
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arya-os-iso
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7
