name: Build Arya OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "build/**"
      - "config/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: arya-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build and BIOS bootloader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common

      - name: Patch Debian Trixie kernel index URL in live-build
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$(dpkg -L live-build | grep -E '/(lb_)?chroot_linux-image$' | head -n 1)"
          test -n "$SCRIPT"
          test -s "$SCRIPT"
          echo "Patching live-build kernel selector: $SCRIPT"

          sudo python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          variables = ("LB_PARENT_DISTRIBUTION", "LB_DISTRIBUTION")
          total = 0
          for variable in variables:
              old = f"${{{variable}}}/Contents-${{LB_ARCHITECTURES}}.gz"
              new = f"${{{variable}}}/main/Contents-${{LB_ARCHITECTURES}}.gz"
              count = source.count(old)
              if count:
                  source = source.replace(old, new)
                  total += count

          if total:
              path.write_text(source)

          verified = sum(
              path.read_text().count(
                  f"${{{variable}}}/main/Contents-${{LB_ARCHITECTURES}}.gz"
              )
              for variable in variables
          )
          if verified < 1:
              raise SystemExit(
                  f"No corrected Debian component Contents URL found in {path}"
              )

          print(f"Verified {verified} corrected Contents index URL(s).")
          PY

          sudo grep -n 'main/Contents-${LB_ARCHITECTURES}.gz' "$SCRIPT"

      - name: Configure Arya OS with the Debian Live Installer
        run: |
          sudo sh auto/config
          sudo lb config --dump | grep -F 'LB_DEBIAN_INSTALLER="live"'
          sudo lb config --dump | grep -F 'LB_LINUX_PACKAGES="linux-image"'

      - name: Prepare live-build ISOLINUX theme
        shell: bash
        run: |
          set -euxo pipefail
          THEME_SOURCE="$(dpkg -L live-build | sed -n 's#/isolinux.cfg$##p' | head -n 1)"
          test -n "$THEME_SOURCE"
          test -s "$THEME_SOURCE/isolinux.cfg"
          install -d config/bootloaders/isolinux
          cp -a "$THEME_SOURCE/." config/bootloaders/isolinux/

          ISOLINUX_BIN="$(dpkg -L isolinux | grep -m1 '/isolinux\.bin$')"
          VESAMENU="$(dpkg -L syslinux-common | grep -m1 '/vesamenu\.c32$')"
          test -s "$ISOLINUX_BIN"
          test -s "$VESAMENU"
          install -m 0644 "$ISOLINUX_BIN" config/bootloaders/isolinux/isolinux.bin
          install -m 0644 "$VESAMENU" config/bootloaders/isolinux/vesamenu.c32

          while IFS= read -r module; do
            install -m 0644 "$module" "config/bootloaders/isolinux/$(basename "$module")"
          done < <(dpkg -L syslinux-common | grep '/usr/lib/syslinux/modules/bios/.*\.c32$')

          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/vesamenu.c32
          find config/bootloaders/isolinux -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Build hybrid installable ISO
        run: sudo lb build

      - name: Find and validate generated installable ISO
        id: iso
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ISOS < <(find . -maxdepth 1 -type f -name '*.iso' -print | sort)
          if [ "${#ISOS[@]}" -ne 1 ]; then
            echo "Expected exactly one ISO, found ${#ISOS[@]}" >&2
            printf '%s\n' "${ISOS[@]}" >&2
            exit 1
          fi

          ISO="${ISOS[0]}"
          test -s "$ISO"
          xorriso -indev "$ISO" -toc >/dev/null

          # A live installer must contain its own Debian Installer kernel/initrd,
          # not just the live-session kernel and filesystem.
          xorriso -osirrox on -indev "$ISO" \
            -extract /install/vmlinuz "$RUNNER_TEMP/arya-installer-vmlinuz" \
            -extract /install/initrd.gz "$RUNNER_TEMP/arya-installer-initrd.gz"
          test -s "$RUNNER_TEMP/arya-installer-vmlinuz"
          test -s "$RUNNER_TEMP/arya-installer-initrd.gz"

          # The graphical installer is enabled in auto/config; verify its payload too.
          xorriso -osirrox on -indev "$ISO" \
            -extract /install/gtk/vmlinuz "$RUNNER_TEMP/arya-installer-gtk-vmlinuz" \
            -extract /install/gtk/initrd.gz "$RUNNER_TEMP/arya-installer-gtk-initrd.gz"
          test -s "$RUNNER_TEMP/arya-installer-gtk-vmlinuz"
          test -s "$RUNNER_TEMP/arya-installer-gtk-initrd.gz"

          xorriso -indev "$ISO" -report_el_torito plain
          sha256sum "$ISO" | tee "$ISO.sha256"
          ls -lh "$ISO" "$ISO.sha256"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arya-os-installable-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 7
 | head -n 1)"
          test -n "$SCRIPT"
          test -s "$SCRIPT"
          echo "Patching live-build kernel selector: $SCRIPT"

          sudo python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old = "}/Contents-${LB_ARCHITECTURES}.gz"
          new = "}/main/Contents-${LB_ARCHITECTURES}.gz"
          count = source.count(old)

          if count:
              source = source.replace(old, new)
              path.write_text(source)

          patched = path.read_text().count(new)
