name: Build Arya OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main, feature/arya-tool-foundation]
    paths:
      - "auto/**"
      - "apps/**"
      - "build/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stage Arya Tool into the live system
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/arya-tool/arya_tool.py
          install -D -m 0755 apps/arya-tool/arya_tool.py config/includes.chroot/usr/local/bin/arya-tool
          install -D -m 0644 apps/arya-tool/arya-tool.desktop config/includes.chroot/usr/share/applications/arya-tool.desktop
          python3 -m py_compile apps/arya-tool/arya_tool.py
          echo "Arya Tool staged and Python syntax validated."

      - name: Stage Arya Tool floating edge launcher
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0755 apps/arya-tool/arya_tool_launcher.py config/includes.chroot/usr/local/bin/arya-tool-launcher
          install -D -m 0644 apps/arya-tool/arya-tool-launcher.desktop config/includes.chroot/usr/share/applications/arya-tool-launcher.desktop
          python3 -m py_compile apps/arya-tool/arya_tool_launcher.py

      - name: Stage Arya Gaming
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0755 apps/arya-gaming/arya_gaming.py config/includes.chroot/usr/local/bin/arya-gaming
          install -D -m 0644 apps/arya-gaming/arya-gaming.desktop config/includes.chroot/usr/share/applications/arya-gaming.desktop
          install -D -m 0644 apps/arya-gaming/arya-gaming.desktop config/includes.chroot/etc/skel/Desktop/arya-gaming.desktop
          python3 -m py_compile apps/arya-gaming/arya_gaming.py

      - name: Stage Arya Center app hub
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/arya-center/arya_center.py
          install -D -m 0755 apps/arya-center/arya_center.py config/includes.chroot/usr/local/bin/arya-center
          install -D -m 0644 apps/arya-center/arya-center.desktop config/includes.chroot/usr/share/applications/arya-center.desktop
          install -D -m 0644 apps/arya-center/arya-center.desktop config/includes.chroot/etc/skel/Desktop/arya-center.desktop
          python3 -m py_compile apps/arya-center/arya_center.py

      - name: Stage Arya Diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/arya-diagnostics/arya_diagnostics.py
          install -D -m 0755 apps/arya-diagnostics/arya_diagnostics.py config/includes.chroot/usr/local/bin/arya-diagnostics
          install -D -m 0644 apps/arya-diagnostics/arya-diagnostics.desktop config/includes.chroot/usr/share/applications/arya-diagnostics.desktop
          python3 -m py_compile apps/arya-diagnostics/arya_diagnostics.py

      - name: Stage Arya Connect
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/arya-connect/arya_connect.py
          install -D -m 0755 apps/arya-connect/arya_connect.py config/includes.chroot/usr/local/bin/arya-connect
          install -D -m 0644 apps/arya-connect/arya-connect.desktop config/includes.chroot/usr/share/applications/arya-connect.desktop
          python3 -m py_compile apps/arya-connect/arya_connect.py

      - name: Test Arya image configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s config/includes.chroot/etc/tor/torrc
          test -s config/includes.chroot/etc/xdg/autostart/lxpolkit.desktop
          test -s config/includes.chroot/etc/xdg/autostart/plank.desktop
          test -s config/includes.chroot/etc/xdg/autostart/arya-tool-launcher.desktop
          python3 -m unittest discover -s tests -v

      - name: Install Debian Trixie live-build and BIOS bootloader dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio debootstrap debian-archive-keyring xorriso squashfs-tools isolinux syslinux-common wget ca-certificates

          DEB="live-build_20250505+deb13u1_all.deb"
          wget -q "https://deb.debian.org/debian/pool/main/l/live-build/${DEB}" -O "${DEB}"
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  ${DEB}" | sha256sum --check
          sudo apt-get install -y --no-install-recommends "./${DEB}"

          VERSION="$(dpkg-query -W -f='${Version}' live-build)"
          test "${VERSION}" = "1:20250505+deb13u1"
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          lb --version

      - name: Configure Arya OS with the Debian Live Installer
        run: |
          sudo sh auto/config
          sudo lb config --dump | grep -F 'LB_DEBIAN_INSTALLER="live"'
          sudo lb config --dump | grep -F 'LB_LINUX_PACKAGES="linux-image"'

      - name: Prepare live-build ISOLINUX theme
        shell: bash
        run: |
          set -euxo pipefail
          THEME_SOURCE="$(dpkg -L live-build | sed -n 's#/isolinux.cfg$##p' | head -n 1)"
          test -n "$THEME_SOURCE"
          test -s "$THEME_SOURCE/isolinux.cfg"
          sudo install -d config/bootloaders/isolinux
          sudo cp -a "$THEME_SOURCE/." config/bootloaders/isolinux/
          ISOLINUX_BIN="$(dpkg -L isolinux | grep -m1 -E '/isolinux[.]bin
          VESAMENU="$(dpkg -L syslinux-common | grep -m1 -E '/vesamenu[.]c32
          test -s "$ISOLINUX_BIN"
          test -s "$VESAMENU"
          sudo install -m 0644 "$ISOLINUX_BIN" config/bootloaders/isolinux/isolinux.bin
          sudo install -m 0644 "$VESAMENU" config/bootloaders/isolinux/vesamenu.c32
          while IFS= read -r module; do
            sudo install -m 0644 "$module" "config/bootloaders/isolinux/$(basename "$module")"
          done < <(dpkg -L syslinux-common | grep -E '/usr/lib/syslinux/modules/bios/.*[.]c32
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/vesamenu.c32
          find config/bootloaders/isolinux -maxdepth 1 -type f -printf '%f\\n' | sort

      - name: Build hybrid installable ISO
        run: sudo lb build

      - name: Find and validate generated installable ISO
        id: iso
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ISOS < <(find . -maxdepth 1 -type f -name '*.iso' -print | sort)
          if [ "${#ISOS[@]}" -ne 1 ]; then
            echo "Expected exactly one ISO, found ${#ISOS[@]}" >&2
            printf '%s\\n' "${ISOS[@]}" >&2
            exit 1
          fi
          ISO="${ISOS[0]}"
          test -s "$ISO"
          xorriso -indev "$ISO" -toc >/dev/null
          xorriso -osirrox on -indev "$ISO" \
            -extract /install/vmlinuz "$RUNNER_TEMP/arya-installer-vmlinuz" \
            -extract /install/initrd.gz "$RUNNER_TEMP/arya-installer-initrd.gz"
          test -s "$RUNNER_TEMP/arya-installer-vmlinuz"
          test -s "$RUNNER_TEMP/arya-installer-initrd.gz"
          xorriso -osirrox on -indev "$ISO" \
            -extract /install/gtk/vmlinuz "$RUNNER_TEMP/arya-installer-gtk-vmlinuz" \
            -extract /install/gtk/initrd.gz "$RUNNER_TEMP/arya-installer-gtk-initrd.gz"
          test -s "$RUNNER_TEMP/arya-installer-gtk-vmlinuz"
          test -s "$RUNNER_TEMP/arya-installer-gtk-initrd.gz"
          xorriso -indev "$ISO" -report_el_torito plain
          sha256sum "$ISO" | tee "$ISO.sha256"
          ls -lh "$ISO" "$ISO.sha256"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arya-os-installable-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 7
)"
          VESAMENU="$(dpkg -L syslinux-common | grep -m1 '/vesamenu\\.c32$')"
          test -s "$ISOLINUX_BIN"
          test -s "$VESAMENU"
          sudo install -m 0644 "$ISOLINUX_BIN" config/bootloaders/isolinux/isolinux.bin
          sudo install -m 0644 "$VESAMENU" config/bootloaders/isolinux/vesamenu.c32
          while IFS= read -r module; do
            sudo install -m 0644 "$module" "config/bootloaders/isolinux/$(basename "$module")"
          done < <(dpkg -L syslinux-common | grep '/usr/lib/syslinux/modules/bios/.*\\.c32$')
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/vesamenu.c32
          find config/bootloaders/isolinux -maxdepth 1 -type f -printf '%f\\n' | sort

